<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Web Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #00d9a3; margin-bottom: 20px; }
        .card { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .chat-box { height: 400px; overflow-y: auto; padding: 16px; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 8px; }
        .user { background: #0f3460; color: #5dade2; }
        .jarvis { background: #0a2a3a; color: #00d9a3; }
        input { width: 100%; padding: 12px; background: #16213e; border: 2px solid #0f3460; border-radius: 8px; color: #e0e0e0; font-size: 14px; }
        button { background: #0f3460; color: #e0e0e0; border: none; border-radius: 6px; padding: 10px 24px; cursor: pointer; margin-top: 8px; }
        button:hover { background: #1a4a7a; }
        .status { display: flex; gap: 12px; margin-bottom: 16px; }
        .stat { flex: 1; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #00d9a3; }
        .stat-label { font-size: 12px; color: #a0a0b0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Jarvis Web Client</h1>

        <div class="status">
            <div class="stat"><div class="stat-value" id="state">—</div><div class="stat-label">State</div></div>
            <div class="stat"><div class="stat-value" id="cpu">—</div><div class="stat-label">CPU</div></div>
            <div class="stat"><div class="stat-value" id="ram">—</div><div class="stat-label">RAM</div></div>
            <div class="stat"><div class="stat-value" id="services">—</div><div class="stat-label">Services</div></div>
        </div>

        <div class="card chat-box" id="chat"></div>
        <div class="card">
            <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
            <button onclick="send()">Send</button>
        </div>
    </div>

    <script>
        const API = '';
        const KEY = 'jarvis-local-dev-key';
        let deviceId = localStorage.getItem('jarvis_device_id') || '';
        let syncVersion = parseInt(localStorage.getItem('jarvis_sync_version') || '0');

        async function registerDevice() {
            if (deviceId) {
                sendHeartbeat();
                return;
            }
            try {
                const res = await fetch(`${API}/api/v1/sync/devices/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: 'Web Client',
                        device_type: 'web',
                        platform: navigator.userAgent.substring(0, 50),
                        capabilities: ['chat', 'sync']
                    })
                });
                const data = await res.json();
                if (data.id) {
                    deviceId = data.id;
                    localStorage.setItem('jarvis_device_id', deviceId);
                    addMsg('jarvis', 'Device registered (ID: ' + deviceId + ')');
                    sendHeartbeat();
                }
            } catch (e) {}
        }

        async function sendHeartbeat() {
            if (!deviceId) return;
            try {
                await fetch(`${API}/api/v1/sync/devices/${deviceId}/heartbeat`, {method: 'POST'});
            } catch (e) {}
        }

        async function pushChat(message, response) {
            if (!deviceId) return;
            try {
                await fetch(`${API}/api/v1/sync/devices/${deviceId}/push`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        data_type: 'chat',
                        payload: {message: message, response: response, timestamp: new Date().toISOString()}
                    })
                });
            } catch (e) {}
        }

        async function pullSync() {
            if (!deviceId) return;
            try {
                const res = await fetch(`${API}/api/v1/sync/devices/${deviceId}/pull?since_version=${syncVersion}&data_type=chat`);
                const data = await res.json();
                if (data.updates && data.updates.length > 0) {
                    for (const update of data.updates) {
                        if (update.version > syncVersion) {
                            syncVersion = update.version;
                            localStorage.setItem('jarvis_sync_version', String(syncVersion));
                        }
                        if (update.payload && update.payload.message && update.device_id !== deviceId) {
                            addMsg('user', '[sync] ' + update.payload.message);
                            if (update.payload.response) {
                                addMsg('jarvis', '[sync] ' + update.payload.response);
                            }
                        }
                    }
                }
            } catch (e) {}
        }

        async function send() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            addMsg('user', msg);

            try {
                const res = await fetch(`${API}/api/v1/chat?message=${encodeURIComponent(msg)}&api_key=${KEY}`);
                const data = await res.json();
                const reply = data.response || data.error || 'No response';
                addMsg('jarvis', reply);
                pushChat(msg, reply);
            } catch (e) {
                addMsg('jarvis', 'Error: ' + e.message);
            }
        }

        function addMsg(role, text) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = (role === 'user' ? 'You: ' : 'Jarvis: ') + text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function updateStatus() {
            try {
                const res = await fetch(`${API}/api/v1/status?api_key=${KEY}`);
                const data = await res.json();
                document.getElementById('state').textContent = data.state || '—';
                document.getElementById('services').textContent = data.services || 0;
                if (data.system) {
                    document.getElementById('cpu').textContent = (data.system.cpu_percent || 0).toFixed(0) + '%';
                    document.getElementById('ram').textContent = (data.system.ram_percent || 0).toFixed(0) + '%';
                }
            } catch (e) {}
        }

        registerDevice();
        setInterval(updateStatus, 5000);
        setInterval(sendHeartbeat, 30000);
        setInterval(pullSync, 10000);
        updateStatus();
    </script>
</body>
</html>
